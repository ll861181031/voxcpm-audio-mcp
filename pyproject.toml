[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voxcpm-audio-mcp"
version = "0.5.1"
description = "MCP server for local VoxCPM2 speech and SoulX-Singer singing synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "gradio-client>=2,<3",
    "soundfile>=0.13",
    "librosa>=0.11",
    "numpy>=1.26,<3",
    "pydantic>=2",
    "nvidia-ml-py>=13.615",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voxcpm-audio-mcp = "voxcpm_audio_mcp.server:main"
voxcpm-audio-agent-config = "voxcpm_audio_mcp.agent_config:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxcpm_audio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
